    <script>
        // ==========================================================
        // PRODUTOS DE CORPO
        // -> troque "imagem" pelo caminho real de cada foto
        // ==========================================================
        const produtosCorpo = [
            { id: 'cor1', nome: 'Hidratante Corporal Manteiga de Karité', categoria: 'hidratante', preco: 54.90, imagem: 'karite.jpg', descricao: 'Com manteiga de karité, nutre profundamente a pele seca e forma uma barreira que mantém a hidratação por horas.' },
            { id: 'cor2', nome: 'Hidratante Corporal de Amêndoas', categoria: 'hidratante', preco: 49.90, imagem: 'amendoas.jpg', descricao: 'Fórmula com óleo de amêndoas que acalma, hidrata e deixa a pele macia e perfumada.' },
            { id: 'cor3', nome: 'Esfoliante Corporal Açúcar & Coco', categoria: 'esfoliante', preco: 44.90, imagem: 'esfoliante.jpg', descricao: 'Grânulos de açúcar e óleo de coco removem células mortas enquanto hidratam, deixando a pele lisa e luminosa.' },
            { id: 'cor4', nome: 'Esfoliante Corporal Café Detox', categoria: 'esfoliante', preco: 47.90, imagem: 'cremees.jpg', descricao: 'Esfoliante com grãos de café que ativa a circulação, renova a pele e ajuda a melhorar o aspecto da celulite.' },
            { id: 'cor5', nome: 'Óleo Corporal Secante Rosa Mosqueta', categoria: 'oleo', preco: 62.90, imagem: 'rosamos.jpg', descricao: 'Óleo de rosa mosqueta de rápida absorção que regenera a pele, ameniza marcas e estrias e não deixa sensação oleosa.' },
            { id: 'cor6', nome: 'Óleo Corporal Iluminador', categoria: 'oleo', preco: 58.90, imagem: 'ilumi.jpg', descricao: 'Óleo com partículas iluminadoras que hidrata e deixa a pele com brilho dourado e acetinado.' },
            { id: 'cor7', nome: 'Body Splash Rosa Branca', categoria: 'splash', preco: 39.90, imagem: 'body.jpg', descricao: 'Fragrância leve e floral de rosa branca que refresca e perfuma o corpo com delicadeza ao longo do dia.' },
            { id: 'cor8', nome: 'Body Splash Baunilha & Âmbar', categoria: 'splash', preco: 42.90, imagem: 'eudorabody.jpg', descricao: 'Fragrância quente e envolvente de baunilha com âmbar, que perfuma a pele com um toque doce e marcante.' },
        ];

        const formatarPreco = valor => `R$ ${valor.toFixed(2).replace('.', ',')}`;

        const listaProdutos = document.getElementById('listaProdutos');

        function renderizarProdutos(categoria = 'todos') {
            listaProdutos.innerHTML = '';

            const produtosFiltrados = categoria === 'todos'
                ? produtosCorpo
                : produtosCorpo.filter(p => p.categoria === categoria);

            produtosFiltrados.forEach(produto => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.dataset.id = produto.id;
                card.dataset.nome = produto.nome;
                card.dataset.preco = produto.preco;

                card.innerHTML = `
                    <img src="${produto.imagem}" alt="${produto.nome}">
                    <div class="product-info">
                        <h3>${produto.nome}</h3>
                        <p class="descricao">${produto.descricao || ''}</p>
                        <p class="price">${formatarPreco(produto.preco)}</p>
                        <button class="btn btn-comprar">Comprar</button>
                        <button class="btn btn-adicionar">Adicionar</button>
                    </div>
                `;

                listaProdutos.appendChild(card);
            });

            ativarBotoes();
        }

        renderizarProdutos();

        // ---------- FILTRO DE CATEGORIAS ----------
        document.getElementById('filtros').addEventListener('click', e => {
            const btn = e.target.closest('.filtro-btn');
            if (!btn) return;
            document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
            btn.classList.add('ativo');
            renderizarProdutos(btn.dataset.cat);
        });

        // ==========================================================
        // CARRINHO (sem depender de exigirLogin/auth.js)
        // ==========================================================
        function ativarBotoes() {
            const cards = document.querySelectorAll('.product-card');

            cards.forEach(card => {
                const btnComprar = card.querySelector('.btn-comprar');
                const btnAdicionar = card.querySelector('.btn-adicionar');

                const produto = {
                    id: card.dataset.id,
                    nome: card.dataset.nome,
                    preco: parseFloat(card.dataset.preco)
                };

                btnComprar.addEventListener('click', () => {
                    localStorage.setItem('compraDireta', JSON.stringify(produto));
                    window.location.href = 'checkout.html';
                });

                btnAdicionar.addEventListener('click', () => {
                    adicionarAoCarrinho(produto);
                    alert(`${produto.nome} adicionado ao carrinho!`);
                });
            });
        }

        function adicionarAoCarrinho(produto) {
            let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

            const existente = carrinho.find(item => item.id === produto.id);
            if (existente) {
                existente.quantidade += 1;
            } else {
                carrinho.push({ ...produto, quantidade: 1 });
            }

            localStorage.setItem('carrinho', JSON.stringify(carrinho));
        }
    </script>
