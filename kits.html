    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="produtos.js"></script>

    <script>
        // ==========================================================
        // KITS: vêm da tabela "produtos" do Supabase (pagina = 'kits')
        // ==========================================================
        const listaProdutos = document.getElementById('listaProdutos');

        async function iniciarProdutos() {
            mensagemProdutos(listaProdutos, 'Carregando kits...');
            const kits = await carregarProdutos('kits');
            if (!kits) return mensagemProdutos(listaProdutos, 'Não foi possível carregar os kits. Tente novamente.');
            if (!kits.length) return mensagemProdutos(listaProdutos, 'Nenhum kit cadastrado ainda.');

            listaProdutos.innerHTML = '';
            kits.forEach(kit => listaProdutos.appendChild(montarCardProduto(kit, { tag: 'kit-tag' })));
            ativarBotoes();
        }

        iniciarProdutos();

        // ==========================================================
        // CARRINHO (mesmo padrão usado nas outras páginas do site)
        // ==========================================================
        function ativarBotoes() {
            document.querySelectorAll('.product-card').forEach(card => {
                const produto = {
                    id: card.dataset.id,
                    nome: card.dataset.nome,
                    preco: parseFloat(card.dataset.preco),
                    imagem: card.querySelector('img').getAttribute('src')
                };

                card.querySelector('.btn-comprar').addEventListener('click', () => {
                    localStorage.setItem('compraDireta', JSON.stringify(produto));
                    window.location.href = 'checkout.html';
                });

                card.querySelector('.btn-adicionar').addEventListener('click', () => {
                    adicionarAoCarrinho(produto);
                    alert(`${produto.nome} adicionado ao carrinho!`);
                });
            });
        }

        function adicionarAoCarrinho(produto) {
            let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

            const existente = carrinho.find(item => item.id === produto.id);
            if (existente) {
                existente.quantidade += 1;
            } else {
                carrinho.push({ ...produto, quantidade: 1 });
            }

            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            atualizarContadorCarrinho();
        }
    </script>
